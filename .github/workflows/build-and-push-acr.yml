name: Z4-04 - Build and push images to ACR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag to use (defaults to commit SHA)"
        required: false
  push:
    branches:
      - main
      - feature/deployment

env:
  # ACR data sources only — does not apply App Service or PostgreSQL.
  TF_WORKING_DIR: infra/terraform-acr
  # App Service to update after pushing a new backend image tag.
  WEBAPP_NAME: promptkb-api
  # Reuse the same RG used for ACR in Terraform step (repo variable already required by workflow).
  WEBAPP_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Azure variables
        run: |
          missing=""
          [ -z "${{ vars.AZURE_CLIENT_ID }}" ] && missing="AZURE_CLIENT_ID $missing"
          [ -z "${{ vars.AZURE_TENANT_ID }}" ] && missing="AZURE_TENANT_ID $missing"
          [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ] && missing="AZURE_SUBSCRIPTION_ID $missing"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo variables (Settings → Actions → Variables): $missing"
            exit 1
          fi

      - name: Azure login (federated identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.8.5' }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform apply (read ACR)
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          TF_VAR_acr_name: ${{ vars.AZURE_ACR_NAME }}
        run: terraform apply -auto-approve -input=false

      - name: Read ACR outputs from Terraform
        id: tf-acr
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            short_sha="${GITHUB_SHA::7}"
            echo "value=$short_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure CLI login to ACR
        run: |
          az acr login --name "${{ steps.tf-acr.outputs.acr_name }}"

      - name: Build backend image
        working-directory: backend
        run: |
          docker build \
            -f Dockerfile \
            -t "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-api:${{ steps.tag.outputs.value }}" \
            .

      - name: Build frontend image
        working-directory: frontend
        run: |
          docker build \
            -f Dockerfile \
            --target prod \
            --build-arg VITE_API_BASE_URL=https://promptkb-api.azurewebsites.net \
            -t "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-web:${{ steps.tag.outputs.value }}" \
            .

      - name: Push images to ACR
        run: |
          docker push "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-api:${{ steps.tag.outputs.value }}"
          docker push "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-web:${{ steps.tag.outputs.value }}"

      - name: Tag and push latest images
        run: |
          # Backend
          docker tag \
            "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-api:${{ steps.tag.outputs.value }}" \
            "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-api:latest"
          docker push "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-api:latest"

          # Frontend
          docker tag \
            "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-web:${{ steps.tag.outputs.value }}" \
            "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-web:latest"
          docker push "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-web:latest"

      - name: Update App Service to unique image tag
        run: |
          # Use unique tag so App Service pulls the new image.
          # If your App Service container credentials are already configured (managed identity via Terraform),
          # this command should only switch the image tag.
          az webapp config container set \
            --name "${{ env.WEBAPP_NAME }}" \
            --resource-group "${{ env.WEBAPP_RESOURCE_GROUP_NAME }}" \
            --container-image-name "${{ steps.tf-acr.outputs.acr_login_server }}/promptkb-api:${{ steps.tag.outputs.value }}"

      - name: Restart App Service
        run: |
          az webapp restart \
            --name "${{ env.WEBAPP_NAME }}" \
            --resource-group "${{ env.WEBAPP_RESOURCE_GROUP_NAME }}"

      - name: Z4-05 — Verify ACR image availability
        run: |
          chmod +x scripts/verify-acr-images.sh
          ./scripts/verify-acr-images.sh "${{ steps.tf-acr.outputs.acr_name }}" "${{ steps.tag.outputs.value }}"

