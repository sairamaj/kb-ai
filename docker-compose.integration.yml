# Phase 1 integration tests (Z4-03): production backend and frontend images
# with a test database. Used by scripts/run-integration-tests.ps1 and manual runs.
# Do not use production credentials or data.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: kb_user
      POSTGRES_PASSWORD: kb_password
      POSTGRES_DB: kb_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb_user -d kb_db"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: prod
    image: promptkb-api:integration
    restart: "no"
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://kb_user:kb_password@db:5432/kb_db
      SECRET_KEY: integration-test-secret
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: http://localhost:8010
    image: promptkb-web:integration
    restart: "no"
    ports:
      - "8081:8080"
    depends_on:
      - backend
