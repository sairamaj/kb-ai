[pytest]
markers =
    integration: Phase 1 deployment integration tests (Z4-03); require Docker and running backend/frontend containers.
    deployment: Phase 3 deployed backend smoke (Z4-08); set TEST_BACKEND_URL or BACKEND_URL to deployed API base URL.
    deployment_e2e: Phase 4 deployed frontend + backend smoke (Z4-10); set TEST_FRONTEND_URL or FRONTEND_URL and TEST_BACKEND_URL or BACKEND_URL.
testpaths = tests
